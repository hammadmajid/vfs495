# Drop-in for fprintd.service: expose libfprint's virtual_image device on a
# root-only socket that the vfs495 feeder daemon connects to. The socket lives
# in fprintd's own state directory (root, 0700): SELinux does not let fprintd
# create one anywhere under /run.
[Service]
Environment=FP_VIRTUAL_IMAGE=/var/lib/fprint/vfs495.sock
